<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">

<!-- FontAwesome CSS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

<!-- CSS -->
<link rel="stylesheet" href="style.css">

<title>Weather App</title>
</head>
<body>

<div class="container">
    <div class="search-box">
        <input type="text" placeholder="Enter city..." id="input">
        <button id="btn"><i class="fa-solid fa-magnifying-glass"></i></button>
        <button id="detect"><i class="fa-solid fa-location-crosshairs"></i></button>
    </div>

    <div class="weather-box">
        <img id="weather-img" src="">
        <h2 id="temp"></h2>
        <p id="desc"></p>
        <p id="location"></p>
    </div>

    <div class="not-found" id="notFound">
        <img src="images/pozavreme.png" alt="Location not found">
        <p>Location not found</p>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
